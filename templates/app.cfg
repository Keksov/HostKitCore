# ============================================================================
# TEMPLATE (HostKitCore/templates/app.cfg) — a host's AppCore launch config.
# GCY2.1 (plan gnauralcity, GCY-D17, GCY-D9): copy it to <host>/server/app.cfg
# and replace the three placeholders — {{PRODUCT}} (the product name),
# {{SERVER_PORT}} (the backend port, the default of the host's server.ts) and
# {{DEV_PORT}} (the quasar dev port). Ports of their own per host keep two
# hosts predictable side by side; a busy one is relocated by AppCore anyway.
# Then delete this paragraph. Written from MindWave's app.cfg (MindWaveCore
# HEAD cd660d5), whose keys AppCore reads (AppConfig.pas).
# ============================================================================
# AppCore launch configuration for {{PRODUCT}}
# ============================================================================
# Run with:  AppMain.exe -config <path-to-this-file>
#   or place AppMain.exe (+ libwebview.dll) next to this file and just run it —
#   AppMain auto-loads the sibling "app.cfg"
#   (HostKitCore/scripts/sync-appcore-launcher.ps1 -ServerDir <this folder>).
#
# Format: KEY=VALUE, one per line. Lines starting with # or ; are comments.
# Relative paths are resolved against THIS file's folder (the server folder).
# ============================================================================


# ---- Mode -------------------------------------------------------------------
#   prod : 1) builds the UI (bun run build in ../ui -> server/public)
#          2) starts the backend (bun run start) which serves BOTH the built UI
#             and the API on ServerPort ({{SERVER_PORT}})
#          3) opens  http://localhost:{{SERVER_PORT}}/
#          -> one server; the normal way to run the app.
#
#   dev  : 1) starts the backend dev server (bun run dev, the HostKitCore
#             watcher) on {{SERVER_PORT}}
#          2) starts quasar dev (bun run dev) on {{DEV_PORT}} in its own console
#             window
#          3) opens DevUrl (http://localhost:{{DEV_PORT}}/), which proxies /api and
#             /ws/ui to the backend on {{SERVER_PORT}}.
Mode=prod


# ---- bun executable ---------------------------------------------------------
# The host ships its own bun in the server folder (HostKitCore/scripts/
# init-host.bat puts it there); pin it (a bare name would be looked up on PATH
# instead).
BunExe=.\bun.exe


# ---- Project folders --------------------------------------------------------
# Backend project (this folder: package.json, server.ts).
ServerDir=.

# Frontend project (quasar): one level up, in ..\ui.
UiDir=..\ui


# ---- Backend port -----------------------------------------------------------
# Port the backend listens on (the default of server.ts, resolveServerPort;
# override with the PORT env var). Must match the quasar dev proxy target
# (defaultBackendPort in ../ui/quasar.config.ts).
#   - prod: the URL AppCore opens -> http://localhost:{{SERVER_PORT}}/
#   - dev : quasar dev proxies /api and /ws/ui to this port.
ServerPort={{SERVER_PORT}}


# ---- Dev URL ----------------------------------------------------------------
# DEV mode only: the quasar dev server (frontend, hot-reload). It proxies
# /api and /ws/ui to ServerPort.
DevUrl=http://localhost:{{DEV_PORT}}/


# ---- Prod build -------------------------------------------------------------
# prod mode only: run "bun run build" (quasar build -> server/public) before
# starting the server. Set false to skip when server/public is already current.
BuildUi=true


# ---- Window -----------------------------------------------------------------
# true  = borderless fullscreen (kiosk);  false = normal 1024x768 window.
FullScreen=true


# ---- Startup wait -----------------------------------------------------------
# Max seconds to wait for the target port before opening the window anyway.
ReadyTimeoutSec=90

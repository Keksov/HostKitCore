# AppCore branding (UTF-8).
# AppTitle = taskbar window title. Custom icon: place AppCore.ico next to the exe,
# or set AppIcon=<base64 of an .ico> here (used only when AppCore.ico is absent).
# TEMPLATE (HostKitCore/templates/AppCore.ini; GCY2.1, GCY-D9): copy it to <host>/server/AppCore.ini
# with the product's name below and delete this paragraph; the host's AppCore.ico goes next to it
# (HostKitCore/scripts/sync-appcore-launcher.ps1 stamps it into AppMain.exe). Written from MindWave's.
AppTitle={{PRODUCT}}
